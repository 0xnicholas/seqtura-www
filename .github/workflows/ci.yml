name: CI

# Branch protection on `main` must require this `quality` job before merge.
# Repository protection settings are maintained in GitHub, not by this workflow.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Check internal links and anchors
        run: pnpm check:links

      - name: Check production output for placeholder sentinels
        run: pnpm check:sentinels

      - name: Install browser
        run: pnpm exec playwright install --with-deps chrome

      - name: Smoke tests
        run: pnpm test

      - name: Lighthouse (Accessibility, Best Practices, SEO = 100)
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 14
